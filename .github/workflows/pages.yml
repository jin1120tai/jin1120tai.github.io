name: Pages

on:
  push:
    branches:
      - main  # 或 master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 18  # 或 24（根据项目需求）
          cache: 'npm'
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
      - name: Deploy
        uses: actions/deploy-pages@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}  # 修正参数名：github_token → token
          path: 'docs/.vitepress/dist'       # 确认构建输出路径（VitePress 默认位置）
